name: Cloud Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment name
        required: true
        default: dev
        type: choice
        options:
          - dev
      action:
        description: Release action
        required: true
        default: build-push
        type: choice
        options:
          - build-push
          - plan
          - deploy
          - smoke
      services:
        description: Comma-separated services
        required: false
        default: api,worker,ui
      image_tag:
        description: Optional immutable image tag override
        required: false
        default: ""
      run_smoke:
        description: Run smoke test after deploy
        required: false
        default: true
        type: boolean
      smoke_llm_mode:
        description: LLM mode used for smoke calls
        required: false
        default: mock
        type: choice
        options:
          - mock
          - openai
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "docker/**"
      - "infra/terraform/**"
      - "scripts/release.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-and-push-images.yml"

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      inputs.environment || 'dev' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      CLOUD_ENV: ${{ vars.CLOUD_ENV }}
      TF_WORKDIR: ${{ vars.TF_WORKDIR }}
      IMAGE_PLATFORM: ${{ vars.IMAGE_PLATFORM }}
      API_AUTH_KEY: ${{ secrets.API_AUTH_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Resolve release parameters
        id: params
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            action="${{ inputs.action }}"
            services="${{ inputs.services }}"
            image_tag="${{ inputs.image_tag }}"
            run_smoke="${{ inputs.run_smoke }}"
            smoke_llm_mode="${{ inputs.smoke_llm_mode }}"
            selected_environment="${{ inputs.environment }}"
          else
            action="build-push"
            services="api,worker,ui"
            image_tag="${GITHUB_SHA::12}"
            run_smoke="false"
            smoke_llm_mode="mock"
            selected_environment="dev"
          fi

          if [ -z "$services" ]; then
            services="api,worker,ui"
          fi

          {
            echo "action=$action"
            echo "services=$services"
            echo "image_tag=$image_tag"
            echo "run_smoke=$run_smoke"
            echo "smoke_llm_mode=$smoke_llm_mode"
            echo "selected_environment=$selected_environment"
          } >> "$GITHUB_OUTPUT"

      - name: Validate environment mapping
        run: |
          set -euo pipefail
          selected="${{ steps.params.outputs.selected_environment }}"
          cloud_env="${CLOUD_ENV:-}"
          if [ -n "$cloud_env" ] && [ "$selected" != "$cloud_env" ]; then
            echo "Mismatch: workflow environment=$selected but CLOUD_ENV=$cloud_env"
            exit 1
          fi

      - name: Configure AWS credentials (with external id)
        if: ${{ secrets.AWS_ROLE_EXTERNAL_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-external-id: ${{ secrets.AWS_ROLE_EXTERNAL_ID }}
          aws-region: ${{ env.AWS_REGION || 'us-west-2' }}

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ROLE_EXTERNAL_ID == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION || 'us-west-2' }}

      - name: Run centralized release action
        run: |
          set -euo pipefail
          cmd=(
            python scripts/release.py "${{ steps.params.outputs.action }}"
            --services "${{ steps.params.outputs.services }}"
            --aws-region "${AWS_REGION:-}"
            --aws-account-id "${AWS_ACCOUNT_ID:-}"
            --project-name "${PROJECT_NAME:-}"
            --cloud-env "${CLOUD_ENV:-}"
            --tf-workdir "${TF_WORKDIR:-}"
            --image-platform "${IMAGE_PLATFORM:-}"
            --smoke-llm-mode "${{ steps.params.outputs.smoke_llm_mode }}"
          )

          if [ -n "${{ steps.params.outputs.image_tag }}" ]; then
            cmd+=(--image-tag "${{ steps.params.outputs.image_tag }}")
          fi

          if [ "${{ steps.params.outputs.run_smoke }}" != "true" ]; then
            cmd+=(--skip-smoke)
          fi

          printf 'Running: %q ' "${cmd[@]}"
          printf '\n'
          "${cmd[@]}"
