services:
  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    env_file:
      - .env.observability
    environment: &langfuse_env
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://127.0.0.1:3000}
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB:-default}
      CLICKHOUSE_URL: >-
        http://${LANGFUSE_CLICKHOUSE_USER:-default}:${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}@langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: >-
        clickhouse://${LANGFUSE_CLICKHOUSE_USER:-default}:${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}@langfuse-clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: ${LANGFUSE_CLICKHOUSE_CLUSTER_ENABLED:-false}
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-media
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- \"http://$${HOSTNAME}:3000\" > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "3000:3000"
    networks:
      - observability_net

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    env_file:
      - .env.observability
    environment:
      <<: *langfuse_env
    networks:
      - observability_net

  langfuse-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U langfuse -d langfuse",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    networks:
      - observability_net

  langfuse-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      LANGFUSE_REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:-}
    command: >
      sh -c 'if [ -n "$${LANGFUSE_REDIS_PASSWORD}" ]; then
      exec redis-server --appendonly no
      --requirepass "$${LANGFUSE_REDIS_PASSWORD}";
      else exec redis-server --appendonly no; fi'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${LANGFUSE_REDIS_PASSWORD}\" ]; then redis-cli --no-auth-warning -a \"$${LANGFUSE_REDIS_PASSWORD}\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - observability_net

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
    networks:
      - observability_net

  langfuse-minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - langfuse_minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - observability_net

  langfuse-minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://langfuse-minio:9000 \
          "${LANGFUSE_MINIO_ACCESS_KEY}" "${LANGFUSE_MINIO_SECRET_KEY}";
        mc mb --ignore-existing local/langfuse-events;
        mc mb --ignore-existing local/langfuse-media;
    networks:
      - observability_net

volumes:
  langfuse_pg_data:
  langfuse_clickhouse_data:
  langfuse_minio_data:

networks:
  observability_net:
    driver: bridge
